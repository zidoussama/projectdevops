apiVersion: v1
kind: Service
metadata:
  name: react-service
  namespace: oussama


spec:
  type: ClusterIP

  selector:
    app: react-app

  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: oussama

spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001